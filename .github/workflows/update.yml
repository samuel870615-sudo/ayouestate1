name: Monthly Housing Data Update

on:
  schedule:
    # 每月 5 號 UTC 02:00（台灣時間上午 10:00）自動執行
    - cron: '0 2 5 * *'
  workflow_dispatch: # 也支援隨時手動點擊按鈕觸發更新

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl xlrd

      - name: Run update script
        run: |
          python update.py

      - name: Commit and push if updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update housing data [skip ci]" && git push)
